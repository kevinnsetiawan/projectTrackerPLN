name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Node 22 / PGlite / build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DB_DRIVER: pglite
      SEED_DEMO: '0'
      REGISTRATION_OPEN: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate an ephemeral test signing key
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'JWT_SECRET=' + require('node:crypto').randomBytes(48).toString('hex') + '\n')"
      - run: npm ci
      - name: Dependency audit (informational baseline)
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npm test
      - name: PGlite unit foundation
        run: node test-unit-foundation.mjs
      - name: PGlite adversarial isolation
        run: node test-upt-isolation.mjs
      - name: Frontend unit context
        run: node src/unit-context.test.mjs
      - name: Agenda calendar
        run: node test-agenda-calendar.mjs
      - name: Closed registration
        run: node test-auth-registration.mjs
      - run: npm run build

  postgres:
    name: PostgreSQL 17 / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: test-local.mjs
            database: protrack_local
          - suite: test-unit-foundation.mjs
            database: protrack_foundation
          - suite: test-upt-isolation.mjs
            database: protrack_isolation
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: protrack_ci
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protrack_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DB_DRIVER: pg
      SEED_DEMO: '0'
      REGISTRATION_OPEN: '0'
      PG_POOL_MAX: '5'
      UNIT_TEST_PG_URL: postgresql://protrack_ci:ci-fixture-only@127.0.0.1:5432/${{ matrix.database }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate an ephemeral test signing key
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'JWT_SECRET=' + require('node:crypto').randomBytes(48).toString('hex') + '\n')"
      - run: npm ci
      - name: Test a fresh dedicated database
        run: node "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}

  verify:
    name: All checks passed
    needs: [regression, postgres]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every test and build job
        env:
          REGRESSION_RESULT: ${{ needs.regression.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: test "$REGRESSION_RESULT" = success && test "$POSTGRES_RESULT" = success

  promote:
    name: Promote verified main to production
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: production-ref-promotion
      cancel-in-progress: false
    steps:
      # This privileged job does not check out or execute repository code.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repository = context.repo;
            const sha = context.sha;
            async function isCurrentMain() {
              const { data } = await github.rest.git.getRef({ ...repository, ref: 'heads/main' });
              if (data.object.sha === sha) return true;
              core.notice('A newer main commit exists; this run will not promote.');
              return false;
            }
            if (!await isCurrentMain()) return;
            let production;
            try {
              production = (await github.rest.git.getRef({ ...repository, ref: 'heads/production' })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (production?.object.sha === sha) {
              core.notice('Production already points to this verified commit.');
              return;
            }
            if (!await isCurrentMain()) return;
            if (production) {
              await github.rest.git.updateRef({ ...repository, ref: 'heads/production', sha, force: false });
            } else {
              await github.rest.git.createRef({ ...repository, ref: 'refs/heads/production', sha });
            }
            core.notice(`Production advanced to verified commit ${sha}.`);
